# Netlify detects Next.js and configures its runtime automatically.
# Do not pin @netlify/plugin-nextjs: Netlify recommends leaving it to update itself.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # The site is live: indexable, no draft banner. The build fails if any file in /data is marked "draft".
  # To hide the site again, for example while testing big changes, change this to "draft".
  NEXT_PUBLIC_CONTENT_STATUS = "live"
