# Netlify detects Next.js and configures its runtime automatically.
# Do not pin @netlify/plugin-nextjs: Netlify recommends leaving it to update itself.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Launch switch. Production stays in draft mode (noindex, robots.txt disallow, draft banner)
# until you set this in Site configuration > Environment variables:
#   NEXT_PUBLIC_CONTENT_STATUS = live
# The build fails if any file in /data is still marked "draft" when this is set.
